<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연수 상세 정보 - 2026 부산대학교 직무연수 포털</title>
  
  <!-- Pretendard WebFont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pnu: {
              navy: '#003B71',
              blue: '#005BAC',
              light: '#00A3E0',
              gold: '#D97706',
              bg: '#F8FAFC'
            }
          },
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- PapaParse CSV 파서 -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- 커스텀 스타일 -->
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 1. GNB 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/95">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3 group">
          <div class="w-10 h-10 rounded-xl bg-pnu-navy text-white flex items-center justify-center font-bold text-lg shadow-sm group-hover:bg-pnu-blue transition">
            PNU
          </div>
          <div>
            <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">국립부산대학교</span>
            <span class="block text-base font-bold text-slate-900 group-hover:text-pnu-navy transition">2026 직무연수 포털</span>
          </div>
        </a>
      </div>

      <nav class="flex items-center space-x-4">
        <a href="index.html" class="inline-flex items-center px-4 py-2 text-xs font-bold rounded-xl bg-slate-100 hover:bg-pnu-navy hover:text-white text-slate-700 transition">
          <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          전체 목록으로
        </a>
      </nav>
    </div>
  </header>

  <!-- 2. Breadcrumbs 경로 네비게이션 -->
  <div class="bg-white border-b border-slate-100 py-3">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex items-center text-xs text-slate-500 space-x-2">
        <a href="index.html" class="hover:text-pnu-blue transition">홈</a>
        <span>/</span>
        <a href="index.html" class="hover:text-pnu-blue transition">직무연수 목록</a>
        <span>/</span>
        <span id="breadcrumb-title" class="text-slate-800 font-bold truncate max-w-xs sm:max-w-md">상세 정보</span>
      </nav>
    </div>
  </div>

  <!-- 3. 메인 상세 콘텐츠 영역 -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <!-- 연수 상세 정보가 렌더링되는 컨테이너 -->
    <div id="detail-content">
      <!-- JS로 동적 렌더링 -->
    </div>

    <!-- 관련 연수 추천 섹션 -->
    <section id="related-courses-section" class="hidden">
      <!-- JS로 동적 렌더링 -->
    </section>
  </main>

  <!-- 4. 푸터 -->
  <footer class="bg-slate-900 text-slate-400 text-xs mt-16 border-t border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="flex flex-col sm:flex-row items-center justify-between text-slate-400 text-[11px] gap-4">
        <div class="flex items-center space-x-2">
          <span class="w-5 h-5 rounded bg-pnu-blue text-white flex items-center justify-center font-bold text-[10px]">PNU</span>
          <span class="font-bold text-white">국립부산대학교 직무연수 포털</span>
          <span class="text-slate-400">&copy; 2026 Pusan National University</span>
        </div>
        <div>
          <a href="index.html" class="hover:text-white transition">연수 목록으로 이동</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- 스크립트 로드 순서: config -> api -> detail -->
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/detail.js"></script>
</body>
</html>
